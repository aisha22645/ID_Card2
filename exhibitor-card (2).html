<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exhibitor Card - Front & Back</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --orange-top:#e4570f;
    --orange-mid:#c63f0b;
    --orange-bot:#a82f0a;
    --cream:#f6d9a0;
    --name:#b5350c;
    --teal1:#52d6c1;
    --teal2:#1fa398;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Poppins',system-ui,sans-serif;
    background:#ffffff;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:70px;
    padding:40px 20px;
    flex-wrap:wrap;
  }

  /* ---------- Card base ---------- */
  .card{
    position:relative;
    width:336px;
    height:540px;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 14px 30px rgba(0,0,0,.28), 0 2px 6px rgba(0,0,0,.18);
  }
  .slot{
    position:absolute;
    top:16px;left:50%;
    transform:translateX(-50%);
    width:62px;height:15px;
    background:#fff;
    border-radius:8px;
    box-shadow:inset 0 2px 3px rgba(0,0,0,.25);
    z-index:20;
  }

  /* ---------- FRONT ---------- */
  .front{
    background:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .55  0 0 0 0 .55  0 0 0 .18 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),
      linear-gradient(180deg,#ffffff 0%,#f7f7f7 100%);
  }
  .paper-wrap{
    position:absolute;inset:0 auto 0 0;
    width:44%;
    filter:drop-shadow(2px 0 2.5px rgba(0,0,0,.28));
    z-index:2;
  }
  .paper-orange{
    width:100%;height:100%;
    background:linear-gradient(180deg,var(--orange-top) 0%,var(--orange-mid) 55%,var(--orange-bot) 100%);
    clip-path:polygon(
      0 0, 86% 0, 89% 5%, 86% 9%, 91% 14%, 95% 19%, 89% 23%, 93% 29%, 87% 35%,
      92% 41%, 89% 47%, 95% 52%, 88% 57%, 92% 63%, 85% 69%, 90% 75%, 86% 81%,
      90% 88%, 87% 94%, 89% 100%, 0 100%
    );
  }
  .front .logo-top{
    position:absolute;top:10px;left:14px;
    display:flex;flex-direction:column;align-items:center;
    z-index:5;
  }
  .front .logo-top img{display:block;width:50px;height:auto}
  .vertical-title{
    position:absolute;
    left:14px;top:26%;
    height:44%;
    writing-mode:vertical-rl;
    transform:rotate(180deg);
    display:flex;align-items:center;justify-content:center;
    font-size:33px;font-weight:700;letter-spacing:2px;
    color:var(--cream);
    z-index:5;
    text-shadow:0 1px 1px rgba(0,0,0,.2);
  }
  .avatar{
    position:absolute;
    left:66%;top:40%;
    width:120px;height:120px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:#d9d9d9;
    border:3px solid #cfcfcf;
    box-shadow:inset 0 0 0 2px #e9e9e9, 0 2px 4px rgba(0,0,0,.15);
    overflow:hidden;
    z-index:4;
  }
  .avatar svg{width:100%;height:100%}
  .name-block{
    position:absolute;
    left:40.5%;top:68.5%;
    z-index:5;
  }
  .name-block h2{
    font-size:24px;font-weight:600;color:var(--name);
    letter-spacing:.3px;line-height:1.2;white-space:nowrap;
  }
  .name-block p{
    font-size:10.5px;color:#111;margin-top:6px;font-weight:400;
  }
  .name-block p b{font-weight:700}
  .bottom-bar{
    position:absolute;left:0;right:0;bottom:0;
    height:36px;
    background:linear-gradient(180deg,#b9360c,#a82f0a);
    display:flex;align-items:center;
    padding-left:83px;gap:6px;
    z-index:6;
  }
  .bottom-bar img{display:block;height:19px;width:auto}
  .bottom-bar span{color:#fff;font-weight:700;font-size:12.5px;letter-spacing:.2px}
  .bottom-bar::before{
    content:"";position:absolute;left:0;top:0;width:0;height:0;
  }

  /* ---------- BACK ---------- */
  .back{
    background:linear-gradient(180deg,#d4490e 0%,#c0390b 45%,#a62d09 100%);
  }
  .swirls{
    position:absolute;left:0;right:0;bottom:0;height:50%;
    opacity:.55;
    -webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 55%);
            mask-image:linear-gradient(180deg,transparent 0%,#000 55%);
  }
  .back .big-logo{
    position:absolute;left:50%;top:18%;
    transform:translateX(-50%);
    display:flex;flex-direction:column;align-items:center;
  }
  .back .big-logo img{display:block;width:166px;height:auto;filter:drop-shadow(0 2px 4px rgba(0,0,0,.22))}
  .back .exhibitor{
    position:absolute;left:0;right:0;top:50.5%;
    text-align:center;color:var(--cream);
    font-size:28px;font-weight:700;letter-spacing:.8px;
  }
  .back .pill{
    position:absolute;left:50%;top:71%;
    transform:translateX(-50%);
    background:rgba(120,30,5,.35);
    border:1px solid rgba(255,255,255,.08);
    color:#fff;font-size:12.5px;font-weight:600;
    padding:9px 22px;border-radius:30px;white-space:nowrap;
    box-shadow:inset 0 1px 2px rgba(255,255,255,.1);
  }
</style>
</head>
<body>
